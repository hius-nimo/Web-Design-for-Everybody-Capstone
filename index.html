<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Coverflow Slider Effect</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="swiper mySwiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <img src="https://picsum.photos/320/450?random=1" alt="Image 1" />
        </div>
        <div class="swiper-slide">
          <img src="https://picsum.photos/320/450?random=2" alt="Image 2" />
        </div>
        <div class="swiper-slide">
          <img src="https://picsum.photos/320/450?random=3" alt="Image 3" />
        </div>
        <div class="swiper-slide">
          <img src="https://picsum.photos/320/450?random=4" alt="Image 4" />
        </div>
        <div class="swiper-slide">
          <img src="https://picsum.photos/320/450?random=5" alt="Image 5" />
        </div>
        <div class="swiper-slide">
          <img src="https://picsum.photos/320/450?random=6" alt="Image 6" />
        </div>
        <div class="swiper-slide">
          <img src="https://picsum.photos/320/450?random=7" alt="Image 7" />
        </div>
      </div>

      <div class="swiper-pagination"></div>

      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script src="script.js"></script>
  </body>
</html>
